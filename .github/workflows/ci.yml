name: ci

on:
  push:
    branches: [beta, main]
  pull_request:
  workflow_dispatch:

# 同一分支连推几次，只留最后一次 —— 不排队烧分钟数
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：只读仓库内容。这个 workflow 只做 checkout / analyze / test，
# 不需要写任何东西；不声明就走仓库默认的 GITHUB_TOKEN 权限（可能是读写）。
permissions:
  contents: read

env:
  # 卡死版本：视觉断言与字号是按这一版量的。改这里必须同时改 BUILD.md 与 AGENTS.md。
  FLUTTER_VERSION: '3.47.2'
  # 用例数基线（只增不减）。加/删用例时同步改这里 —— 它是「护栏会不会被悄悄拆掉」的唯一把手。
  # 口径 = `cd app && flutter test`（不带路径）实际跑过的条数，不含 `app/tool/visual/` 那批（数量随屏单增长，认尾行 `+N`，别写死）。
  # 哪天有人把视觉用例挪进 `app/test/`，这个数要跟着跳一次。
  # 2026-11-06：0.12.9 / 0.12.10 两轮把条数从 1220 推到 1236（+2 格高容差、+3 液态升程下限、+2 快照推送、+1 彩边、+1 重试、…），
  # 而这里停在 1228 —— 于是 beta 上连续两次红，红的是守卫本身、不是被测代码。
  EXPECTED_TESTS: '1260'
  # 字体**不再靠环境变量把关**：三份字体已经进仓库（app/test/fonts/），
  # `ensureVisualFonts()` 缺一个就无条件抛错 —— 比一个「本地不设就不生效」的开关更严。
  # 2026-11-05 第一次 CI 红了 8 条，报错是 `Found 0 widgets with key
  # [<'header-single-row'>]` 之类，与真因（runner 上没有英文字体、文字渲成方块）
  # 毫无关系；那次就是因为 $FLUTTER_ROOT/bin/cache/artifacts/material_fonts 在
  # flutter-action 还原缓存后是空目录。详见 app/tool/visual/visual_harness.dart 文件头。
  # runner 默认 UTC；本仓库当前无 TZ 敏感用例（已逐条核过），保留此行只为固定环境，
  # 撤掉不影响结果。
  TZ: Asia/Shanghai

jobs:
  analyze:
    name: analyze + 生成代码是否最新
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true          # 缓存 SDK 本体，命中时省掉 clone + precache

      - name: pub 缓存
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: flutter analyze
        working-directory: app
        run: flutter analyze

      # 改了 Drift 表却忘了重生成 —— 编译期看不出来，运行期报「列不存在」。
      # 生成物 app/lib/data/app_database.g.dart 是入库的，所以这里能比。
      - name: 生成代码是否最新
        working-directory: app
        run: |
          # 别再带 `--delete-conflicting-outputs`：build_runner 2.15.1 已移除这个参数，
          # 传了只打一句 “These options have been removed and were ignored”，删除冲突输出已是默认行为。
          dart run build_runner build
          if ! git diff --quiet -- lib/data/app_database.g.dart; then
            echo '::error::app_database.g.dart 与表定义不一致 —— 本地跑 `dart run build_runner build` 后提交生成物'
            git --no-pager diff --stat -- lib/data/app_database.g.dart
            exit 1
          fi

      # 文档断链：图片必须全通，相对链接同时认「相对文件」与「相对仓库根」。
      # 纯 stdlib，不需要额外装依赖。
      - name: 文档断链
        run: python3 scripts/link_check.py

  test:
    name: flutter test（用例数守卫）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: pub 缓存
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # 硬需求，不是保险：用例直接 package:sqlite3 开内存库，而
      # sqlite3-2.9.4/lib/src/ffi/load_library.dart:60 在 Linux 上只有一句
      # DynamicLibrary.open('libsqlite3.so')，没有 .so.0 回退；
      # Ubuntu 的 libsqlite3-0 只给带版本号的库文件，无版本软链由 -dev 包提供。
      - name: 系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # 四条「文字尺寸」类用例量的是**真实字形宽度**，靠
      # app/tool/visual/visual_harness.dart 的 ensureVisualFonts() 现场装字体。
      # 三份字体都在仓库里（app/test/fonts/），本地与 CI 读同一份字节 —— 量尺只有一把。
      # 这一步只是提前把「文件没进仓库 / 被 LFS 吞了」这类事喊出来，快于跑完 40 秒才炸。
      - name: 字体资产
        shell: bash
        run: |
          for f in app/test/fonts/roboto-regular.ttf \
                   app/test/fonts/materialicons-regular.otf \
                   app/test/fonts/NotoSansSC-Regular.otf; do
            if [ ! -s "$f" ]; then
              echo "::error::缺字体资产 $f —— 视觉/量字宽用例会直接抛 StateError。"
              exit 1
            fi
            ls -l "$f"
          done
          echo "字体齐了：三份都来自仓库"

      - name: flutter test
        working-directory: app
        shell: bash
        run: |
          # GitHub Actions 默认 `bash -e`，**没有 pipefail**：`flutter test | tee` 的退出码是 tee 的 0，
          # 红了的测试会被整条管道吞掉，CI 照样绿。这一行不能省。
          set -o pipefail
          log="$RUNNER_TEMP/flutter-test.log"
          flutter test --reporter expanded 2>&1 | tee "$log"

          # 末行形如 `00:43 +1214: All tests passed!`；skip: 掉的用例不计入 +N，
          # 所以「删测试文件」和「给用例加 skip」这两条路都会被数字变小抓到。
          total=$(grep -oE '^[0-9]{2}:[0-9]{2} \+[0-9]+' "$log" | tail -1 | grep -oE '\+[0-9]+' | tr -d '+')
          if [ -z "$total" ]; then
            echo "::error::没能从日志里解析出用例数 —— 输出格式变了？看 $log"
            exit 1
          fi
          echo "用例数 $total（期望 $EXPECTED_TESTS）"
          if [ "$total" != "$EXPECTED_TESTS" ]; then
            echo "::error::用例数 $total ≠ 期望 $EXPECTED_TESTS —— 删了测试、给用例加了 skip:，或者真加了用例却没改 env.EXPECTED_TESTS"
            exit 1
          fi
