name: site

# 官网 + APK 镜像站（Cloudflare Pages）。
#
# 每次发版（GitHub Release published）自动把 site/ + 截图 + 本次的 APK
# 组装成一个静态目录推上去，国内用户从这里下 APK，不走 github.com。
#
# 为什么不在仓库里存 APK：dist/ 是 gitignore 的，23MB 的二进制进 git 会
# 把仓库越滚越大。APK 只在部署时从 Release 拉一次，用完即弃。
#
# 前置（只需做一次，见 AGENTS.md「官网与下载镜像」）：
#   repo secrets 里配好 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID。
#   没配时本 workflow 不报红，只组装好站点并给出 warning。

on:
  release:
    types: [published]
  # GitHub 只从**默认分支**读 `release` 事件的 workflow —— 这条 push 触发是为了
  # 让 beta 上改站点也能当场部署，不必等下次 stable 发布把 site.yml 带进 main。
  # 只改站点/截图时触发，改代码不触发。
  push:
    branches: [beta, main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
      - 'docs/images/hero.png'
      - 'docs/images/shot-*.png'
      - 'docs/images/v0130-*.gif'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: true

env:
  # 站点根地址。换自定义域名时改这一处，同时改 app/lib/core/update_checker.dart 的 _siteBase。
  SITE_BASE: https://daoban-shift.pages.dev
  PROJECT_NAME: daoban-shift

jobs:
  deploy:
    name: 组装并部署官网
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: 组装站点
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site/assets _site/download
          cp site/index.html site/styles.css _site/
          cp docs/images/hero.png _site/assets/
          cp docs/images/shot-*.png _site/assets/
          # 只挑两张 GIF：整站首屏控制在 ~8MB 内，其余走 GitHub
          cp docs/images/v0130-color.gif docs/images/v0130-monthly.gif _site/assets/

          # ---- 取 main 上的清单当底稿 ----
          # release 事件是在 release.ps1 建完 Release 的**那一刻**触发的，
          # 那时仓库里的 latest.json 还没更新（脚本第 8 步在后面）。
          # 而且 beta 那份的 stable 可能停在旧值 —— main 上的才是权威。
          if git fetch --no-tags origin main 2>/dev/null \
             && git show origin/main:latest.json > _base_latest.json 2>/dev/null; then
            echo "底稿：origin/main:latest.json"
          else
            cp latest.json _base_latest.json
            echo "::warning::取不到 origin/main 的 latest.json，退回当前检出版本（另一通道可能偏旧）"
          fi

          # ---- 本次要发布哪个版本 ----
          PRE="false"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            PRE="${{ github.event.release.prerelease }}"
          else
            # push / 手动触发：带的是清单里的最新正式版，不在代码里猜
            TAG="v$(python3 -c "import json;print(json.load(open('_base_latest.json'))['stable']['version'])")"
          fi
          VERSION="${TAG#v}"
          if [ "$PRE" = "true" ]; then CHANNEL=prerelease; else CHANNEL=stable; fi
          echo "版本 $VERSION（通道 $CHANNEL）"

          # ---- 拉本次的 APK ----
          gh release download "$TAG" --pattern '*.apk' --dir _site/download
          APK=$(find _site/download -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Release $TAG 里没有 APK 资产"
            exit 1
          fi
          ASSET=$(basename "$APK")
          SIZE=$(stat -c%s "$APK")
          echo "APK $ASSET / $SIZE 字节"
          # Cloudflare Pages 单文件上限 25 MiB。逼近时改放 R2，别等它某天突然炸。
          if [ "$SIZE" -gt 26214400 ]; then
            echo "::error::APK $SIZE 字节已超过 Pages 单文件 25 MiB 上限 —— 需要改放 Cloudflare R2"
            exit 1
          fi
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # 当前这一步的 shell 也要有，下面的 python 直接读环境变量
          export ASSET VERSION

          # ---- 生成站点自己的发布清单 ----
          export CHANNEL SITE_BASE
          python3 - <<'PY'
          import datetime, json, os

          base = os.environ["SITE_BASE"].rstrip("/")
          version = os.environ["VERSION"]
          asset = os.environ["ASSET"]
          channel = os.environ["CHANNEL"]

          with open("_base_latest.json", encoding="utf-8") as f:
              m = json.load(f)

          node = m.get(channel) or {}
          node["version"] = version
          node["url"] = f"{base}/download/{asset}"
          node["asset"] = asset
          node["prerelease"] = (channel == "prerelease")
          m[channel] = node
          m["updatedAt"] = datetime.datetime.now(
              datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          with open("_site/latest.json", "w", encoding="utf-8") as f:
              json.dump(m, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(json.dumps(m, ensure_ascii=False, indent=2))
          PY

          du -sh _site

      - name: 检查部署凭据
        id: creds
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::未配置 CLOUDFLARE_API_TOKEN —— 站点已组装在 _site/，但没有部署。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 留存站点产物
        if: steps.creds.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-standalone
          path: _site
          retention-days: 7

      - name: 部署到 Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _site
            --project-name=${{ env.PROJECT_NAME }}
            --branch=main
            --commit-dirty=true

      - name: 部署后自检
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # 站点刚推上去，边缘可能有几秒延迟
          code=""
          for _ in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_BASE/latest.json" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "latest.json -> HTTP $code"
          [ "$code" = "200" ]
          curl -fsS "$SITE_BASE/latest.json"
          echo
          code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-1023 "$SITE_BASE/download/$ASSET" || true)
          echo "APK 头 1KB -> HTTP $code"
          [ "$code" = "200" ] || [ "$code" = "206" ]
