name: shiftassistantpro
description: 倒班助手Pro — Flutter 倒班排班助手（本地离线，液态玻璃设计）
publish_to: 'none'
version: 0.5.0+70

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 本地数据库（类型安全 SQLite）
  drift: ^2.20.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # 闹钟 / 通知
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # 工具
  intl: ^0.20.3
  lunar_plus: ^1.7.1
  shared_preferences: ^2.3.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
