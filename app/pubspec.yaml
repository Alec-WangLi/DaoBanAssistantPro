name: shiftassistantpro
description: 倒班助手Pro — Flutter 倒班排班助手（本地离线，液态玻璃设计）
publish_to: 'none'
version: 0.14.4+219

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 本地数据库（类型安全 SQLite）
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5
  path: ^1.9.1

  # 闹钟 / 通知
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2

  # 工具
  characters: ^1.4.0
  intl: ^0.20.3
  lunar_plus: ^1.7.1
  shared_preferences: ^2.5.6

  cupertino_icons: ^2.0.0
  archive: ^4.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  # 迁移测试直接用裸 sqlite3 建 v5 形态的 fixture 库。
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true
  assets:
    # 打赏二维码。缺图由 `test/donate_assets_test.dart` 拦在 CI 上，
    # 不让空目录或占位图跟着发版。
    - assets/donate/
  shaders:
    # 玻璃容器边缘的逐像素折射（BackdropFilter 滤镜链的最后一段）。
    # 加载失败时 GlassRefraction 会静默关掉这一层，画面回落到纯模糊。
    - shaders/glass_refraction.frag
